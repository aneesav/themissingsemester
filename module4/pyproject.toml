[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "themissingsemester-module4"
version = "0.1.0"
description = "Module 4: AI in Genomics - The Missing Semester"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "The Missing Semester", email = "contact@themissingsemester.com"}
]
keywords = ["bioinformatics", "genomics", "ai", "scRNA", "langchain", "openai", "scGPT"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # Core scientific stack
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "scikit-learn==1.6.0",
    "statsmodels==0.14.4",

    # Single-cell genomics
    "anndata==0.11.1",
    "scanpy==1.10.4",
    "cellxgene-census==1.17.0",
    "tiledbsoma==1.17.0",
    "loompy==3.0.8",
    "session_info==1.0.0",

    # Dimensionality reduction
    "umap-learn==0.5.7",
    "pynndescent==0.5.13",
    "numba==0.60.0",
    "llvmlite==0.43.0",

    # AI / LLM
    "openai==1.12.0",
    "langchain==0.1.7",
    "langchain-community==0.0.20",
    "langchain-core==0.1.23",
    "langchain-pinecone==0.0.2",
    "langsmith==0.0.87",
    "tiktoken==0.6.0",
    "pinecone-client==3.0.2",
