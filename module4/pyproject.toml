[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0",
]

[project.urls]
Homepage = "https://themissingsemester.substack.com"
Documentation = "https://themissingsemester.substack.com"
Repository = "https://github.com/aneesav/themissingsemester"
"Bug Tracker" = "https://github.com/aneesav/themissingsemester/issues"

[tool.setuptools]
packages = ["themissingsemester"]

[tool.setuptools.package-data]
themissingsemester = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W"]
ignore = ["E501"]
